<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0f12">
<title>空房间 · The Room She Left</title>
<style>html,body{margin:0;padding:0;background:#000;}</style>
</head>
<body>
<div id="game-root" style="margin:0;padding:0;">
<style>
#game-root *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
#game-root{--ink:#c9c4b8;--dim:#6b6a63;--blood:#8a2b2b;--amber:#d7a66d;
 font-family:'Courier New',monospace;background:#000;display:flex;justify-content:center;min-height:100vh;align-items:center;}
#gw{position:relative;width:100%;max-width:420px;height:min(100vh,760px);
 background:#0d0f12;overflow:hidden;color:var(--ink);border:1px solid #1c1f24;
 box-shadow:0 0 40px #000 inset;}
#gw .vig{position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(ellipse at 50% 42%,transparent 40%,#000 115%);z-index:40;}
#gw .scan{position:absolute;inset:0;pointer-events:none;z-index:41;opacity:.5;
 background:repeating-linear-gradient(#0000 0 2px,#0000000f 2px 3px);}
#gw .room{position:absolute;inset:0;background:linear-gradient(#15171b,#0b0d10 70%,#070809);}
#gw .wall{position:absolute;left:0;right:0;top:0;height:62%;
 background:repeating-linear-gradient(90deg,#141619 0 38px,#111316 38px 40px);border-bottom:2px solid #000;}
#gw .floor{position:absolute;left:0;right:0;bottom:0;height:38%;
 background:repeating-linear-gradient(#101215 0 26px,#0c0e11 26px 28px);}
.hot{position:absolute;cursor:pointer;z-index:20;}
.hot:active{filter:brightness(1.4);}
.lbl{position:absolute;z-index:21;font-size:10px;color:var(--dim);letter-spacing:1px;pointer-events:none;text-shadow:0 0 4px #000;}
.photo{top:11%;left:50%;transform:translateX(-50%) rotate(-1deg);width:116px;height:92px;
 background:#1b1d22;border:5px solid #2a2622;box-shadow:0 6px 14px #000;}
.photo .pp{position:absolute;inset:7px;background:linear-gradient(135deg,#30343c,#1a1c20);overflow:hidden;}
.photo .fig{position:absolute;bottom:0;width:30px;height:52px;border-radius:14px 14px 0 0;background:#0a0b0d;}
.photo .f1{left:20px;} .photo .f2{right:20px;}
.photo .scratch{position:absolute;z-index:3;}
.photo .scratch i{position:absolute;height:2px;background:#000;transform-origin:left;}
.bed{bottom:6%;left:4%;width:52%;height:30%;background:linear-gradient(#20222a,#15171c);border:1px solid #000;border-radius:6px 6px 2px 2px;}
.bed:before{content:'';position:absolute;top:-14px;left:8px;width:40px;height:22px;background:#2a2d35;border-radius:6px;}
.stand{bottom:7%;right:6%;width:30%;height:24%;background:linear-gradient(#1c1a18,#111010);border:1px solid #000;}
.drawer{position:absolute;left:12%;right:12%;top:30%;height:26%;background:linear-gradient(#262320,#1a1816);border:1px solid #000;}
.drawer:after{content:'';position:absolute;top:44%;left:42%;width:16%;height:8%;background:#000;border-radius:3px;}
.win{top:14%;right:5%;width:26%;height:30%;background:linear-gradient(#0a1420,#06080c);border:6px solid #1a1c20;box-shadow:0 0 18px #0a1420 inset;}
.win:before,.win:after{content:'';position:absolute;background:#1a1c20;}
.win:before{left:50%;top:0;bottom:0;width:3px;margin-left:-1px;}
.win:after{top:50%;left:0;right:0;height:3px;margin-top:-1px;}
.cal{bottom:40%;left:6%;width:20%;height:16%;background:#15140f;border:1px solid #000;display:flex;flex-direction:column;}
.cal .top{height:34%;background:var(--blood);}
.cal .num{flex:1;display:flex;align-items:center;justify-content:center;color:#d8d2c4;font-size:22px;font-weight:bold;}
.ov{position:absolute;inset:0;z-index:60;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;padding:22px;}
.ov.on{display:flex;}
.card{width:100%;max-width:300px;background:#141210;border:1px solid #33302a;padding:20px;box-shadow:0 0 30px #000;}
.card h3{font-size:13px;letter-spacing:2px;color:var(--amber);margin-bottom:12px;}
.card p{font-size:13px;line-height:1.9;color:var(--ink);white-space:pre-wrap;}
.x{position:absolute;top:12px;right:16px;font-size:22px;color:var(--dim);cursor:pointer;z-index:61;}
.lk{display:flex;gap:8px;justify-content:center;margin:16px 0;}
.lk .d{width:46px;height:60px;background:#000;border:1px solid #3a3630;color:var(--amber);font-size:30px;display:flex;align-items:center;justify-content:center;}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.pad button{padding:12px;background:#1c1a16;color:var(--ink);border:1px solid #33302a;font-size:18px;font-family:inherit;cursor:pointer;}
.pad button:active{background:#2a2620;}
.msg{text-align:center;font-size:11px;color:var(--blood);height:14px;margin-top:6px;letter-spacing:1px;}
#inv{position:absolute;bottom:0;left:0;right:0;height:46px;z-index:45;background:#0a0b0dcc;border-top:1px solid #1c1f24;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:10px;color:var(--dim);letter-spacing:1px;}
#inv .it{color:var(--amber);}
.full{position:absolute;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:30px;text-align:center;}
.full h2{font-size:16px;letter-spacing:3px;color:var(--ink);margin-bottom:18px;line-height:1.8;}
.full p{font-size:12px;color:var(--dim);line-height:2;margin-bottom:24px;}
.full button{padding:12px 26px;background:#1c1a16;color:var(--amber);border:1px solid #33302a;font-family:inherit;font-size:13px;letter-spacing:2px;cursor:pointer;}
.flick{animation:fl 6s infinite;}
@keyframes fl{0%,97%,100%{opacity:1}98%{opacity:.6}99%{opacity:.9}}
</style>
<div id="gw">
 <div class="room flick"></div><div class="wall"></div><div class="floor"></div>
 <div class="hot photo" data-act="photo"><div class="pp"><div class="fig f1"></div><div class="fig f2"></div><div class="scratch" id="scr"></div></div></div>
 <div class="lbl" style="top:25%;left:50%;transform:translateX(-50%)">合照</div>
 <div class="hot win" data-act="win"></div>
 <div class="hot cal" data-act="cal"><div class="top"></div><div class="num">6</div></div>
 <div class="hot bed" data-act="bed"></div>
 <div class="hot stand" data-act="stand"></div>
 <div class="hot drawer" data-act="drawer"></div>
 <div class="lbl" style="top:56%;left:14%">日历</div>
 <div class="lbl" style="top:30%;left:50%;transform:translateX(-50%)">抽屉</div>
 <div class="vig"></div><div class="scan"></div>
 <div id="inv"><span>物品：</span><span id="invlist" class="it">—</span></div>
 <div class="ov" id="ovText"><span class="x" data-close>×</span>
   <div class="card"><h3 id="tTitle"></h3><p id="tBody"></p></div></div>
 <div class="ov" id="ovLock"><span class="x" data-close>×</span>
   <div class="card"><h3>抽屉上的四位密码锁</h3>
     <div class="lk"><div class="d" id="d0">_</div><div class="d" id="d1">_</div><div class="d" id="d2">_</div><div class="d" id="d3">_</div></div>
     <div class="pad" id="pad"></div><div class="msg" id="lmsg"></div></div></div>
 <div class="full" id="intro"><h2>空 房 间</h2>
   <p>你回到这间屋子。<br>她不在。<br>灯还亮着，像在等谁。<br><br>（点一点房间里的东西）</p>
   <button id="startBtn">推 门 进 去</button></div>
 <div class="full" id="ending" style="display:none;"><h2 id="endH"></h2><p id="endP"></p>
   <button id="againBtn">再 来 一 次</button></div>
</div>
<script>(function(){
 var root=document.getElementById('gw');var CODE="4621";var buf="";
 var inv={photo:false,cal:false,win:false,stand:false};
 var scr=document.getElementById('scr');
 for(var i=0;i<9;i++){var s=document.createElement('i');
   s.style.left=(28+Math.random()*52)+'px';s.style.top=(14+Math.random()*40)+'px';
   s.style.width=(26+Math.random()*34)+'px';s.style.transform='rotate('+(Math.random()*160-80)+'deg)';scr.appendChild(s);}
 var texts={
  photo:["合照","照片上是两个人。\n右边那个的脸，被人用指甲一下一下划花了，\n只剩左边的人在笑。\n\n照片背面写着一行小字：\n「第 4 个夏天。」\n\n（记住了：4）"],
  cal:["墙上的日历","停在某一天。\n大半页数字都被红笔圈了又圈，\n只有一个数字反复描到发亮——\n\n6 号。\n她说过那天还会来。\n\n（记住了：6）"],
  win:["结霜的窗","玻璃上有一层白雾。\n你凑近，呵一口气，\n雾里浮出一个被谁提前写好的数字：\n\n2\n\n下面还有一行快化掉的小字：\n「别走。」\n\n（记住了：2）"],
  stand:["床头柜","抽屉拉不开，锁着。\n柜面上有一个相框，空的。\n相框的卡槽里卡着一张小纸片，\n上面只有一个数字：\n\n1\n\n（记住了：1）"],
  bed:["床","被子叠得整整齐齐，\n枕头上有一个浅浅的头形，\n像有人刚躺过，又像很久没人躺了。\n枕头底下什么都没有。\n只有一点凉。"]
 };
 function invRender(){var k=[];if(inv.photo)k.push('4');if(inv.cal)k.push('6');if(inv.win)k.push('2');if(inv.stand)k.push('1');
   document.getElementById('invlist').textContent=k.length?('已找到 '+k.length+'/4 个数字'):'—';}
 function openText(act){var t=texts[act];if(!t)return;
   document.getElementById('tTitle').textContent=t[0];document.getElementById('tBody').textContent=t[1];
   document.getElementById('ovText').classList.add('on');if(act in inv){inv[act]=true;invRender();}}
 function openLock(){document.getElementById('ovLock').classList.add('on');draw();}
 function draw(){for(var i=0;i<4;i++){document.getElementById('d'+i).textContent=buf[i]||'_';}}
 root.addEventListener('click',function(e){
   if(e.target.hasAttribute('data-close')){e.target.parentNode.classList.remove('on');return;}
   var h=e.target.closest('.hot');if(!h)return;var act=h.getAttribute('data-act');
   if(act==='drawer'){openLock();}else{openText(act);}});
 var pad=document.getElementById('pad');
 [1,2,3,4,5,6,7,8,9,'←',0,'✓'].forEach(function(n){
   var b=document.createElement('button');b.textContent=n;
   b.onclick=function(){if(n==='←'){buf=buf.slice(0,-1);}
     else if(n==='✓'){check();return;}else if(buf.length<4){buf+=n;}draw();};pad.appendChild(b);});
 function check(){var m=document.getElementById('lmsg');
   if(buf.length<4){m.textContent='还差几位';return;}
   if(buf===CODE){m.textContent='咔哒——锁开了';setTimeout(ending,900);}
   else{m.textContent='不对。锁纹丝不动。';buf="";setTimeout(draw,400);
     root.style.transform='translateX(3px)';setTimeout(function(){root.style.transform='';},80);}}
 function ending(){document.getElementById('ovLock').classList.remove('on');
   document.getElementById('endH').textContent='抽 屉 开 了';
   document.getElementById('endP').innerHTML=('里面是一封没寄出的信。\n\n「如果你读到这里，\n说明你终于回来了。\n我把每一天都数给你听过：\n第4个夏天，6号，窗上的2，\n还有相框里那个1——\n那是我，一直等的那个人。\n\n你终于来了。」').replace(/\n/g,'<br>');
   document.getElementById('ending').style.display='flex';}
 document.getElementById('startBtn').onclick=function(){document.getElementById('intro').style.display='none';};
 document.getElementById('againBtn').onclick=function(){buf="";for(var k in inv)inv[k]=false;invRender();draw();
   document.getElementById('ending').style.display='none';document.getElementById('intro').style.display='flex';};
 invRender();
})();</script>
</div>
</body>
</html>
